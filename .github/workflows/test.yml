name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  ANDOR_MOCK: "1"
  QT_QPA_PLATFORM: offscreen
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}

          # Install core deps (skip local Andor SDK file:// packages)
          uv pip install \
            "numpy>=1.20" \
            "matplotlib>=3.5" \
            "pymeasure>=0.15.0" \
            "pyqtgraph>=0.13.3" \
            "pyside6>=6.6.3.1" \
            "pyyaml>=6.0" \
            "h5py>=3.0" \
            "pyserial>=3.5" \
            "pytest>=7.0" \
            "pytest-cov>=4.0" \
            "ruff>=0.1.0"

          # nidaqmx is Windows-only; allow failure
          uv pip install "nidaqmx>=0.6" || true

          # Install project without its deps (already installed above)
          uv pip install --no-deps -e .

      - name: Lint
        run: .venv/bin/ruff check src/ || echo "::warning::Ruff found lint issues (non-blocking)"

      - name: Run tests
        run: |
          .venv/bin/pytest tests/ \
            --ignore=tests/integration \
            -x -q \
            --tb=short
