name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  ANDOR_MOCK: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (CI — no hardware SDKs)
        run: |
          # Install core deps without the local Andor SDK file:// packages
          uv pip install --system \
            "numpy>=1.20" \
            "matplotlib>=3.5" \
            "pymeasure>=0.15.0" \
            "pyqtgraph>=0.13.3" \
            "pyside6>=6.6.3.1" \
            "pyyaml>=6.0" \
            "h5py>=3.0" \
            "pyserial>=3.5" \
            "pytest>=7.0" \
            "pytest-cov>=4.0" \
            "ruff>=0.1.0"

          # nidaqmx is Windows-only; install but allow failure
          uv pip install --system "nidaqmx>=0.6" || true

          # Install project in editable mode without deps (already installed above)
          uv pip install --system --no-deps -e .

      - name: Lint
        run: uv run ruff check src/

      - name: Run tests
        run: |
          uv run pytest tests/ \
            --ignore=tests/integration \
            -x -q \
            --tb=short
