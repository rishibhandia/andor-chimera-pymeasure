# TA Scan Configuration
# Edit this file and load it from the TA panel in the GUI.

# --- Delay list ---
delay_list:
  - -10.0
  - -5.0
  - 0.0
  - 1.0
  - 2.0
  - 5.0
  - 10.0
  - 20.0
  - 50.0
  - 100.0
  - 200.0
  - 500.0
  - 1000.0

# --- Averaging / scan control ---
n_averages: 10          # pump-on/pump-off pairs averaged per delay point
n_scans: 1              # number of complete passes through delay_list
acquisition_mode: boxcar  # boxcar | shot_to_shot
scan_direction: alternating  # forward | alternating (reverses on odd scans)

# --- Sample metadata ---
sample_name: ""
notes: ""

# --- NI DAQ hardware phase reader ---
# Chopper 500 Hz REF OUT  →  USER 2 BNC  →  jumper to P0.0 screw terminal  (nidaq_di_channel)
# Must use Port 0 — only Port 0 supports buffered hardware-clocked DI on PCIe-6353.
# Laser sync OUT          →  PFI0 BNC  (nidaq_clock_source) — MUST be PFI, used as sample clock
# Laser sync OUT          →  Camera Ext Trigger SMB  (same signal, T-split)
nidaq_device: "Astrella DAQ"
nidaq_di_channel: port0/line0   # USER 2 BNC → P0.0 screw terminal — chopper 500 Hz REF OUT
nidaq_clock_source: "/Astrella DAQ/PFI0"  # PFI0 BNC — laser sync 1 kHz (sample clock)
nidaq_clock_rate: 1000.0        # laser repetition rate in Hz

# --- Wavelengths (optional) ---
# Leave as null to use the full detector range.
wavelengths: null
