[project]
name = "andor-chimera-pymeasure"
version = "0.1.0"
description = "PyMeasure and Qt-based Andor spectrometer control"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5",
    "pymeasure>=0.15.0",
    "pyqtgraph>=0.13.3",
    "pyside6>=6.6.3.1",
    "pyyaml>=6.0",
    "h5py>=3.0",
    "pyserial>=3.5",
    "nidaqmx>=0.6",
    "pyandorsdk2 @ file:///C:/Program%20Files/Andor%20SDK/Python/pyAndorSDK2",
    "pyandorspectrograph @ file:///C:/Program%20Files/Andor%20SDK/Python/pyAndorSpectrograph",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
andor-pymeasure = "andor_pymeasure.app:main"
andor-qt = "andor_qt.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/andor_pymeasure", "src/andor_qt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Ensure widgets are cleaned up between tests to prevent Qt memory leaks
qt_qapp_cls = "PySide6.QtWidgets.QApplication"

[tool.ruff]
line-length = 100
target-version = "py38"
